<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proton - لوحة تحكم الأداء</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="./favicon.webp">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Styles -->
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./dashboard.css">
</head>
<body class="proton-dashboard-body">

    <div class="main-container">

        <!-- الهيدر العلوي -->
        <header class="top-header" id="header-container"></header>

        <!-- المحتوى الرئيسي للوحة التحكم (مساحة العرض الخضراء) -->
        <main class="dashboard-workspace">
            
            <!-- حاوية الأيقونات الجانبية (شريط التحكم) -->
            <aside class="sidebar-dock" id="sidebarDock">
                <!-- يتم توليد الأيقونات ديناميكياً أو إضافتها هنا -->
            </aside>

            <!-- منطقة عرض المحتوى النشط -->
            <section class="active-content-area" id="activeContentArea">
                <!-- الافتتاحية التلقائية: تقارير الأداء والإحصائيات -->
            </section>

        </main>

        <!-- Footer الموحد -->
        <footer id="footer-container"></footer>

    </div>

    <!-- السكربتات -->
    <script type="module" src="./dashboard.js" defer></script>
    <script src="./whatsapp-widget.js" defer></script>
    <script src="./auth-guard.js" defer></script>
    <script src="./header.js" defer></script>
</body>
</html>
