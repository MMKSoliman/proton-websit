<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proton - لوحة التحكم</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="./favicon.png">

    <!-- Google Fonts: Cairo & Open Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <div class="main-container">

        <!-- الهيدر العلوي -->
        <div class="top-header">
            <!-- سيتم تعبئته ديناميكياً بواسطة header.js أو عناصر التنقل -->
        </div>

        <!-- محتوى لوحة التحكم في المنتصف -->
        <div class="center-content">
            <div class="dashboard-card">
                <span class="status-badge" id="statusBadge">جاري التجهيز والربط ⏳</span>
                
                <h2 class="card-title" id="cardTitle">لوحة التحليلات والإدارة</h2>
                
                <p class="card-subtitle" id="cardSubtitle">
                    سيتم تفعيل اللوحة وعرض التحديثات والإحصائيات فور الوصول إلى نتائج التحليل واستلام الصلاحيات المطلوبة للمنصات.
                </p>

                <a href="./connect-social.html" class="action-link">
                    🔗 ربط أو تعديل منصات التواصل الآن
                </a>
            </div>
        </div>

        <!-- Footer الموحد -->
        <div id="footer-container"></div>

    </div>

    <!-- السكربتات والوظائف -->
    <script>
        // جلب محتوى الفوتر الخارجي
        fetch('footer.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('footer-container').innerHTML = data;
            });
    </script>

    <script>
       // كود جلب حالة الداشبورد وتحديث محتوى الصفحة فقط
       window.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const tokenFromUrl = urlParams.get("token");
            if (tokenFromUrl) {
                localStorage.setItem("access_token", tokenFromUrl);
                window.history.replaceState({}, document.title, window.location.pathname);
            }

            const token = localStorage.getItem('access_token');

            try {
                const response = await fetch('https://api.protonag.com/v1/dashboard/status', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': token ? 'Bearer ' + token : ''
                    }
                });

                if (response.ok) {
                    const data = await response.json();
                    
                    if (data.status_text && document.getElementById('statusBadge')) {
                        document.getElementById('statusBadge').textContent = data.status_text;
                    }
                    if (data.title && document.getElementById('cardTitle')) {
                        document.getElementById('cardTitle').textContent = data.title;
                    }
                    if (data.subtitle && document.getElementById('cardSubtitle')) {
                        document.getElementById('cardSubtitle').textContent = data.subtitle;
                    }
                    if (data.full_name && document.getElementById('full_name')) {
                        document.getElementById('full_name').textContent = data.full_name;
                    }
                }
            } catch (error) {
                console.error("Dashboard Sync Error:", error);
            }
        });
    </script>
    <script src="./whatsapp-widget.js" defer></script>
    <script src="./auth-guard.js" defer></script>
    <script src="./header.js" defer></script>
</body>
</html>
