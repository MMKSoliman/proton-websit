<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proton - لوحة تحكم الإدارة</title>
    <link rel="icon" type="image/png" href="./favicon.webp">
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <!-- نافذة تسجيل الدخول -->
    <div class="login-overlay" id="loginOverlay">
        <div class="login-box">
            <h2>تسجيل دخول الأدمن</h2>
            <div class="input-group">
                <label>اسم المستخدم</label>
                <input type="text" id="adminUser" placeholder="admin">
            </div>
            <div class="input-group">
                <label>كلمة السر</label>
                <input type="password" id="adminPass" placeholder="••••••">
            </div>
            <button class="btn-login" onclick="handleLogin()">دخول لوحة التحكم</button>
        </div>
    </div>

    <div class="main-container">
        <header class="top-header">
            <h1 class="page-title">لوحة <span>Proton Admin</span></h1>
            <button class="btn-logout" onclick="logout()">تسجيل الخروج</button>
        </header>

        <div class="dashboard-card">
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Client ID</th>
                            <th>العميل ورقم الهاتف</th>
                            <th>النشاط ورقم الهاتف</th>
                            <th>المنصة</th>
                            <th>حالة العميل</th>
                            <th>نشر تلقائي</th>
                            <th>نشر الريلز</th>
                            <th>التعليقات</th>
                            <th>الرسائل</th>
                            <th>مدة الاشتراك وتاريخ الانتهاء</th>
                            <th>المبلغ (EGP)</th>
                        </tr>
                    </thead>
                    <tbody id="clientsTableBody">
                        <!-- يتم جلب البيانات الحقيقية ديناميكياً هنا -->
                    </tbody>
                </table>
            </div>
        </div>

        <div class="summary-card">
            <div class="summary-item">
                <span class="summary-label">إجمالي العملاء:</span>
                <span class="summary-value" id="totalClients">0</span>
            </div>
            <div class="summary-item">
                <span class="summary-label">إجمالي المنصات المربوطة:</span>
                <span class="summary-value" id="totalPlatforms">0</span>
            </div>
            <div class="summary-item">
                <span class="summary-label">إجمالي الإيراد الشهري:</span>
                <span class="summary-value" id="totalRevenue">0 EGP</span>
            </div>
        </div>
    </div>

    <script>
        let currentAuthToken = '';

        window.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('admin_token');
            if (token) {
                currentAuthToken = token;
                document.getElementById('loginOverlay').style.display = 'none';
                fetchClientsData(token);
            }
        });

        async function handleLogin() {
            const user = document.getElementById('adminUser').value;
            const pass = document.getElementById('adminPass').value;
            if (user === 'admin' && pass === '123456') {
                currentAuthToken = 'active_session';
                localStorage.setItem('admin_token', currentAuthToken);
                document.getElementById('loginOverlay').style.display = 'none';
                fetchClientsData(currentAuthToken);
            } else {
                alert('بيانات الدخول غير صحيحة!');
            }
        }

        async function fetchClientsData(token) {
            try {
                const response = await fetch('https://api.protonag.com/v1/admin/dashboard-clients', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if (response.ok) {
                    const data = await response.json();
                    renderTable(data);
                } else {
                    console.error("فشل جلب البيانات الحقيقية");
                }
            } catch (err) {
                console.error("خطأ في الاتصال:", err);
            }
        }

        function renderTable(data) {
            const tbody = document.getElementById('clientsTableBody');
            tbody.innerHTML = '';
            let totalRev = 0;
            let uniqueClients = new Set();

            data.forEach(item => {
                uniqueClients.add(item.client_id);
                totalRev += Number(item.paid_amount) || 0;

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><span class="client-id-badge">${item.client_id}</span></td>
                    <td class="client-info">
                        <span class="client-name">${item.client_name}</span><br>
                        <small class="client-phone">${item.client_phone}</small>
                    </td>
                    <td class="client-info">
                        <span class="client-name">${item.brand_name}</span><br>
                        <small class="client-phone">${item.brand_phone}</small>
                    </td>
                    <td><span class="platform-badge">${item.platform}</span></td>
                    <td>
                        <label class="switch">
                            <input type="checkbox" ${item.active ? 'checked' : ''} onchange="updateAccountField(${item.account_id}, 'active', this.checked)">
                            <span class="slider"></span>
                        </label>
                    </td>
                    <td>
                        <label class="switch">
                            <input type="checkbox" ${item.posts ? 'checked' : ''} onchange="updateAccountField(${item.account_id}, 'posts', this.checked)">
                            <span class="slider"></span>
                        </label>
                    </td>
                    <td>
                        <label class="switch">
                            <input type="checkbox" ${item.reels ? 'checked' : ''} onchange="updateAccountField(${item.account_id}, 'reels', this.checked)">
                            <span class="slider"></span>
                        </label>
                    </td>
                    <td>
                        <label class="switch">
                            <input type="checkbox" ${item.comments ? 'checked' : ''} onchange="updateAccountField(${item.account_id}, 'comments', this.checked)">
                            <span class="slider"></span>
                        </label>
                    </td>
                    <td>
                        <label class="switch">
                            <input type="checkbox" ${item.messages ? 'checked' : ''} onchange="updateAccountField(${item.account_id}, 'messages', this.checked)">
                            <span class="slider"></span>
                        </label>
                    </td>
                    <td>
                        <input type="number" class="days-input" value="${item.subscription_days}" id="days-${item.account_id}" style="width:50px;" onchange="updateDays(${item.account_id}, this.value)"> يوم
                        <br><small style="color:#00e5ff;">الانتهاء: <span id="expiry-${item.account_id}">${item.expiry_date}</span></small>
                    </td>
                    <td>
                        <input type="number" value="${item.paid_amount}" style="width:70px; background:#0d1117; color:#00e5ff; border:1px solid #30363d; border-radius:6px; padding:4px;" onchange="updatePrice(${item.account_id}, this.value)"> EGP
                    </td>
                `;
                tbody.appendChild(row);
            });

            document.getElementById('totalClients').textContent = uniqueClients.size;
            document.getElementById('totalPlatforms').textContent = data.length;
            document.getElementById('totalRevenue').textContent = `${totalRev} EGP`;
        }

        async function updateAccountField(accountId, fieldName, value) {
            const payload = { [fieldName]: value };
            await sendUpdate(accountId, payload);
        }

        async function updateDays(accountId, daysValue) {
            const payload = { subscription_days: parseInt(daysValue) };
            const res = await sendUpdate(accountId, payload);
            if (res && res.ok) {
                location.reload(); // إعادة تحميل لتحديث تاريخ الانتهاء المعروض
            }
        }

        async function updatePrice(accountId, priceValue) {
            const payload = { paid_amount: parseFloat(priceValue) };
            await sendUpdate(accountId, payload);
            location.reload();
        }

        async function sendUpdate(accountId, payload) {
            try {
                const response = await fetch(`https://api.protonag.com/v1/admin/clients/${accountId}/update`, {
                    method: 'PATCH',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + currentAuthToken 
                    },
                    body: JSON.stringify(payload)
                });
                return response;
            } catch (error) {
                console.error("خطأ في حفظ التعديل:", error);
            }
        }

        function logout() {
            localStorage.removeItem('admin_token');
            document.getElementById('loginOverlay').style.display = 'flex';
        }
    </script>
</body>
</html>
