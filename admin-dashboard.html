<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proton - لوحة تحكم الإدارة</title>
    <link rel="icon" type="image/png" href="./favicon.webp">
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <!-- نافذة تسجيل الدخول -->
    <div class="login-overlay" id="loginOverlay">
        <div class="login-box">
            <h2>تسجيل دخول الأدمن</h2>
            <div class="input-group">
                <label>اسم المستخدم</label>
                <input type="text" id="adminUser" placeholder="admin">
            </div>
            <div class="input-group">
                <label>كلمة السر</label>
                <input type="password" id="adminPass" placeholder="••••••">
            </div>
            <button class="btn-login" onclick="handleLogin()">دخول لوحة التحكم</button>
        </div>
    </div>

    <div class="main-container">
        <header class="top-header">
            <h1 class="page-title">لوحة <span>Proton Admin</span></h1>
            <button class="btn-logout" onclick="logout()">تسجيل الخروج</button>
        </header>

        <div class="dashboard-card">
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Client ID</th>
                            <th>العميل ورقم الهاتف</th>
                            <th>النشاط ورقم الهاتف</th>
                            <th>المنصة</th>
                            <th>حالة العميل</th>
                            <th>عدد الريلز (rc / المنشور)</th>
                            <th>مدة الاشتراك وتاريخ الانتهاء</th>
                            <th>المبلغ المدفوع (EGP)</th>
                        </tr>
                    </thead>
                    <tbody id="clientsTableBody">
                        <!-- يتم جلب البيانات ديناميكياً من الباك إند -->
                    </tbody>
                </table>
            </div>
        </div>

        <div class="summary-card">
            <div class="summary-item">
                <span class="summary-label">إجمالي العملاء:</span>
                <span class="summary-value" id="totalClients">0</span>
            </div>
            <div class="summary-item">
                <span class="summary-label">إجمالي المنصات المربوطة:</span>
                <span class="summary-value" id="totalPlatforms">0</span>
            </div>
            <div class="summary-item">
                <span class="summary-label">إجمالي الإيراد الشهري:</span>
                <span class="summary-value" id="totalRevenue">0 EGP</span>
            </div>
        </div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('admin_token');
            if (token) {
                document.getElementById('loginOverlay').style.display = 'none';
                fetchClientsData(token);
            }
        });

        async function handleLogin() {
            const user = document.getElementById('adminUser').value;
            const pass = document.getElementById('adminPass').value;
            if (user === 'admin' && pass === '123456') {
                localStorage.setItem('admin_token', 'active_session');
                document.getElementById('loginOverlay').style.display = 'none';
                fetchClientsData('active_session');
            } else {
                alert('بيانات الدخول غير صحيحة!');
            }
        }

        async function fetchClientsData(token) {
            try {
                const response = await fetch('https://api.protonag.com/v1/admin/dashboard-clients', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if (response.ok) {
                    const data = await response.json();
                    renderTable(data);
                } else {
                    loadFallbackData();
                }
            } catch (err) {
                loadFallbackData();
            }
        }

        function loadFallbackData() {
            const fallback = [
                {
                    account_id: 1,
                    client_id: "CL-1001",
                    client_name: "محمد سليمان",
                    client_phone: "+201012345678",
                    brand_name: "شركة الأمل للتجارة",
                    brand_phone: "+201099887766",
                    platform: "Facebook",
                    active: true,
                    rc: 15,
                    posted_reels: 10,
                    subscription_days: 30,
                    expiry_date: "2026-05-28",
                    paid_amount: 1500,
                    currency: "EGP"
                }
            ];
            renderTable(fallback);
        }

        function renderTable(data) {
            const tbody = document.getElementById('clientsTableBody');
            tbody.innerHTML = '';
            let totalRev = 0;
            let uniqueClients = new Set();

            data.forEach(item => {
                uniqueClients.add(item.client_id);
                totalRev += Number(item.paid_amount) || 0;

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><span class="client-id-badge">${item.client_id}</span></td>
                    <td class="client-info">
                        <span class="client-name">${item.client_name}</span><br>
                        <small class="client-phone">${item.client_phone}</small>
                    </td>
                    <td class="client-info">
                        <span class="client-name">${item.brand_name}</span><br>
                        <small class="client-phone">${item.brand_phone}</small>
                    </td>
                    <td><span class="platform-badge">${item.platform}</span></td>
                    <td>
                        <label class="switch">
                            <input type="checkbox" ${item.active ? 'checked' : ''} onchange="toggleActivation(${item.account_id}, this.checked, this)">
                            <span class="slider"></span>
                        </label>
                    </td>
                    <td><b>${item.rc}</b>طلب / (${item.posted_reels} منشور)</td>
                    <td>
                        <input type="number" class="days-input" value="${item.subscription_days}" id="days-${item.account_id}" style="width:60px;"> يوم
                        <br><small style="color:#00e5ff;">الانتهاء: <span id="expiry-${item.account_id}">${item.expiry_date}</span></small>
                    </td>
                    <td style="color: #00e5ff; font-weight: bold;"><span id="price-${item.account_id}">${item.paid_amount}</span> ${item.currency}</td>
                `;
                tbody.appendChild(row);
            });

            document.getElementById('totalClients').textContent = uniqueClients.size;
            document.getElementById('totalPlatforms').textContent = data.length;
            document.getElementById('totalRevenue').textContent = `${totalRev} EGP`;
        }

        async function toggleActivation(accountId, isActive, checkbox) {
            const daysInput = document.getElementById(`days-${accountId}`).value;
            
            try {
                const response = await fetch(`https://api.protonag.com/v1/admin/clients/${accountId}/activate`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ active: isActive, subscription_days: parseInt(daysInput) })
                });
                
                if (response.ok) {
                    const resData = await response.json();
                    document.getElementById(`expiry-${accountId}`).textContent = resData.expiry_date;
                    document.getElementById(`price-${accountId}`).textContent = resData.paid_amount;
                }
            } catch (error) {
                console.error("فشل التحديث الفوري:", error);
            }
        }

        function logout() {
            localStorage.removeItem('admin_token');
            document.getElementById('loginOverlay').style.display = 'flex';
        }
    </script>
</body>
</html>
