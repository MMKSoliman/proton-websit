<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proton - لوحة تحكم الإدارة</title>
    <link rel="icon" type="image/png" href="./favicon.webp">
    <link rel="stylesheet" href="./style.css">
    <style>
        /* 1. إخفاء أسهم الزيادة والنقصان في المدخلات الرقمية */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type=number] {
            -moz-appearance: textfield;
        }

        /* 2. إصلاح تنسيق Client ID Badge */
        .client-id-badge {
            background: rgba(0, 229, 255, 0.1);
            color: #00e5ff;
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.85rem;
            white-space: nowrap; /* إبقاء النص في سطر واحد */
            display: inline-block;
            border: 1px solid rgba(0, 229, 255, 0.2);
        }

        /* 3. أزرار التحكم المصغرة (Switches) */
        .proton-switch {
            position: relative;
            display: inline-block;
            width: 38px;
            height: 20px;
        }
        .proton-switch input { opacity: 0; width: 0; height: 0; }
        .proton-slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #30363d; transition: .3s; border-radius: 20px;
        }
        .proton-slider:before {
            position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px;
            background-color: white; transition: .3s; border-radius: 50%;
        }

        /* تفعيل أزرار الخدمات باللون الأخضر */
        .service-switch input:checked + .proton-slider {
            background-color: #2ea043;
            box-shadow: 0 0 6px rgba(46, 160, 67, 0.5);
        }
        .service-switch input:checked + .proton-slider:before { transform: translateX(18px); }

        /* تفعيل زر حالة العميل بلون بروتون النيوني المميز */
        .master-switch input:checked + .proton-slider {
            background-color: #00e5ff;
            box-shadow: 0 0 8px rgba(0, 229, 255, 0.6);
        }
        .master-switch input:checked + .proton-slider:before { transform: translateX(18px); }
        
        /* تجميد الأزرار في السطر عند عدم تفعيل العميل */
        .row-disabled {
            opacity: 0.35;
            pointer-events: none;
        }

        /* حقول إدخال الأيام، المبلغ، وعدد الريلز */
        .days-input, .price-input, .rc-input {
            background: #0d1117;
            color: #00e5ff;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 4px;
            text-align: center;
            font-family: 'Cairo', sans-serif;
            font-weight: 600;
        }
        .rc-input {
            width: 42px;
            color: #3fb950;
            border-color: rgba(46, 160, 67, 0.4);
        }
        .platform-badge {
            background: #21262d;
            color: #c9d1d9;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <!-- نافذة تسجيل الدخول -->
    <div class="login-overlay" id="loginOverlay">
        <div class="login-box">
            <h2>تسجيل دخول الأدمن</h2>
            <div class="input-group">
                <label>اسم المستخدم</label>
                <input type="text" id="adminUser" placeholder="admin">
            </div>
            <div class="input-group">
                <label>كلمة السر</label>
                <input type="password" id="adminPass" placeholder="••••••">
            </div>
            <button class="btn-login" onclick="handleLogin()">دخول لوحة التحكم</button>
        </div>
    </div>

    <div class="main-container">
        <header class="top-header">
            <h1 class="page-title">لوحة <span>Proton Admin</span></h1>
            <button class="btn-logout" onclick="logout()">تسجيل الخروج</button>
        </header>

        <div class="dashboard-card">
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Client ID</th>
                            <th>العميل ورقم الهاتف</th>
                            <th>النشاط ورقم الهاتف</th>
                            <th>المنصة</th>
                            <th>حالة العميل</th>
                            <th>نشر تلقائي</th>
                            <th>نشر الريلز (rc)</th>
                            <th>التعليقات</th>
                            <th>الرسائل</th>
                            <th>مدة الاشتراك وتاريخ الانتهاء</th>
                            <th>المبلغ (EGP)</th>
                        </tr>
                    </thead>
                    <tbody id="clientsTableBody">
                        <!-- البيانات الحقيقية تمشيطاً مع السيرفر -->
                    </tbody>
                </table>
            </div>
        </div>

        <div class="summary-card">
            <div class="summary-item">
                <span class="summary-label">إجمالي العملاء:</span>
                <span class="summary-value" id="totalClients">0</span>
            </div>
            <div class="summary-item">
                <span class="summary-label">إجمالي المنصات المربوطة:</span>
                <span class="summary-value" id="totalPlatforms">0</span>
            </div>
            <div class="summary-item">
                <span class="summary-label">إجمالي الإيراد الشهري:</span>
                <span class="summary-value" id="totalRevenue">0 EGP</span>
            </div>
        </div>
    </div>

    <script>
        let currentAuthToken = '';

        window.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('admin_token');
            if (token) {
                currentAuthToken = token;
                document.getElementById('loginOverlay').style.display = 'none';
                fetchClientsData(token);
            }
        });

        async function handleLogin() {
            const user = document.getElementById('adminUser').value;
            const pass = document.getElementById('adminPass').value;
            if (user === 'admin' && pass === '123456') {
                currentAuthToken = 'active_session';
                localStorage.setItem('admin_token', currentAuthToken);
                document.getElementById('loginOverlay').style.display = 'none';
                fetchClientsData(currentAuthToken);
            } else {
                alert('بيانات الدخول غير صحيحة!');
            }
        }

        async function fetchClientsData(token) {
            try {
                const response = await fetch('https://api.protonag.com/v1/admin/dashboard-clients', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if (response.ok) {
                    const data = await response.json();
                    renderTable(data);
                }
            } catch (err) {
                console.error("خطأ في جلب البيانات:", err);
            }
        }

        function renderTable(data) {
            const tbody = document.getElementById('clientsTableBody');
            tbody.innerHTML = '';
            let totalRev = 0;
            let uniqueClients = new Set();

            data.forEach(item => {
                uniqueClients.add(item.client_id);
                totalRev += Number(item.paid_amount) || 0;

                const isActive = item.active === true;
                const daysVal = (item.subscription_duration_days !== null && item.subscription_duration_days !== undefined) ? item.subscription_duration_days : 30;

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><span class="client-id-badge">${item.client_id}</span></td>
                    <td class="client-info">
                        <span class="client-name">${item.client_name || 'غير معروف'}</span><br>
                        <small style="color: rgba(255,255,255,0.6);">${item.client_phone || 'غير متوفر'}</small>
                    </td>
                    <td class="client-info">
                        <span class="client-name">${item.brand_name || 'غير معروف'}</span><br>
                        <small style="color: rgba(255,255,255,0.6);">${item.brand_phone || 'غير متوفر'}</small>
                    </td>
                    <td><span class="platform-badge">${item.platform}</span></td>
                    <!-- زر تفعيل العميل الأساسي (Master Switch - Proton Color) -->
                    <td>
                        <label class="proton-switch master-switch">
                            <input type="checkbox" ${isActive ? 'checked' : ''} onchange="updateAccountField(${item.account_id}, 'active', this.checked)">
                            <span class="proton-slider"></span>
                        </label>
                    </td>
                    <!-- أزرار الخدمات (Service Switches - Green Color) -->
                    <td class="${!isActive ? 'row-disabled' : ''}">
                        <label class="proton-switch service-switch">
                            <input type="checkbox" ${item.posts ? 'checked' : ''} onchange="updateAccountField(${item.account_id}, 'posts', this.checked)">
                            <span class="proton-slider"></span>
                        </label>
                    </td>
                    <td class="${!isActive ? 'row-disabled' : ''}">
                        <div style="display:flex; align-items:center; gap:6px;">
                            <label class="proton-switch service-switch">
                                <input type="checkbox" ${item.reels ? 'checked' : ''} onchange="updateAccountField(${item.account_id}, 'reels', this.checked)">
                                <span class="proton-slider"></span>
                            </label>
                            <!-- حقل إدخال عدد الريلز rc قابل للتعديل المباشر -->
                            <input type="number" class="rc-input" value="${item.rc || 0}" onchange="updateAccountField(${item.account_id}, 'rc', parseInt(this.value))">
                        </div>
                    </td>
                    <td class="${!isActive ? 'row-disabled' : ''}">
                        <label class="proton-switch service-switch">
                            <input type="checkbox" ${item.comments ? 'checked' : ''} onchange="updateAccountField(${item.account_id}, 'comments', this.checked)">
                            <span class="proton-slider"></span>
                        </label>
                    </td>
                    <td class="${!isActive ? 'row-disabled' : ''}">
                        <label class="proton-switch service-switch">
                            <input type="checkbox" ${item.messages ? 'checked' : ''} onchange="updateAccountField(${item.account_id}, 'messages', this.checked)">
                            <span class="proton-slider"></span>
                        </label>
                    </td>
                    <!-- مدة الاشتراك والتاريخ بدون أسهم رقمية -->
                    <td>
                        <input type="number" class="days-input" value="${daysVal}" id="days-${item.account_id}" style="width:50px;" onchange="updateDays(${item.account_id}, this.value)"> يوم
                        <br><small style="color:#00e5ff; font-size:0.75rem;">الانتهاء: <span id="expiry-${item.account_id}">${item.expiry_date || '---'}</span></small>
                    </td>
                    <!-- المبلغ بدون أسهم رقمية -->
                    <td>
                        <input type="number" class="price-input" value="${item.paid_amount || 0}" id="price-${item.account_id}" style="width:75px;" onchange="updatePrice(${item.account_id}, this.value)"> EGP
                    </td>
                `;
                tbody.appendChild(row);
            });

            document.getElementById('totalClients').textContent = uniqueClients.size;
            document.getElementById('totalPlatforms').textContent = data.length;
            document.getElementById('totalRevenue').textContent = `${totalRev} EGP`;
        }

        async function updateAccountField(accountId, fieldName, value) {
            const payload = { [fieldName]: value };
            const res = await sendUpdate(accountId, payload);
            if (res && res.ok && fieldName === 'active') {
                fetchClientsData(currentAuthToken); // إعادة تحميل البيانات فورياً لتطبيق تجميد الخدمات
            }
        }

        async function updateDays(accountId, daysValue) {
            const payload = { subscription_duration_days: parseInt(daysValue) || 30 };
            const res = await sendUpdate(accountId, payload);
            if (res && res.ok) {
                fetchClientsData(currentAuthToken);
            }
        }

        async function updatePrice(accountId, priceValue) {
            const payload = { paid_amount: parseFloat(priceValue) || 0 };
            const res = await sendUpdate(accountId, payload);
            if (res && res.ok) {
                fetchClientsData(currentAuthToken);
            }
        }

        async function sendUpdate(accountId, payload) {
            try {
                const response = await fetch(`https://api.protonag.com/v1/admin/clients/${accountId}/update`, {
                    method: 'PATCH',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + currentAuthToken 
                    },
                    body: JSON.stringify(payload)
                });
                return response;
            } catch (error) {
                console.error("خطأ في التحديث:", error);
            }
        }

        function logout() {
            localStorage.removeItem('admin_token');
            document.getElementById('loginOverlay').style.display = 'flex';
        }
    </script>
</body>
</html>
