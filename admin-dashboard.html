<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proton - لوحة تحكم الإدارة</title>
    <link rel="icon" type="image/png" href="./favicon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        *, button, input, select {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Open Sans', 'Cairo', system-ui, -apple-system, sans-serif !important;
        }

        body, html {
            min-height: 100vh;
            width: 100%;
            background-color: #0d0d0d;
            color: #ffffff;
            overflow-x: hidden;
        }

        .main-container {
            position: relative;
            min-height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 1rem;
            background: #0d0d0d url('./bg.png') center/cover no-repeat;
            box-sizing: border-box;
        }

        /* Login Overlay */
        .login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(13, 13, 13, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .login-box {
            background: rgba(18, 18, 18, 0.95);
            border: 1px solid rgba(0, 229, 255, 0.3);
            border-radius: 16px;
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0, 229, 255, 0.15);
            text-align: center;
        }

        .login-box h2 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            color: #00e5ff;
        }

        .login-box p {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 1.5rem;
        }

        .input-group {
            margin-bottom: 1.2rem;
            text-align: right;
        }

        .input-group label {
            display: block;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 0.4rem;
        }

        .input-group input {
            width: 100%;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            border-color: #00e5ff;
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #0047ab, #00e5ff);
            color: #fff;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-top: 0.5rem;
        }

        .btn-login:hover {
            opacity: 0.9;
        }

        /* Top Header */
        .top-header {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            z-index: 20;
        }

        .page-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .page-title span {
            color: #00e5ff;
        }

        .btn-logout {
            padding: 8px 16px;
            background: rgba(255, 77, 77, 0.15);
            border: 1px solid #ff4d4d;
            color: #ff4d4d;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.82rem;
            transition: all 0.2s;
        }

        .btn-logout:hover {
            background: #ff4d4d;
            color: #fff;
        }

        /* Dashboard Main Card */
        .dashboard-card {
            width: 100%;
            max-width: 1200px;
            background: rgba(18, 18, 18, 0.88);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            margin-bottom: 1.5rem;
            z-index: 10;
        }

        /* Table Styling */
        .table-responsive {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            min-width: 950px;
        }

        th, td {
            padding: 1rem 0.6rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 0.85rem;
        }

        th {
            background: rgba(255, 255, 255, 0.03);
            color: #00e5ff;
            font-weight: 600;
            white-space: nowrap;
        }

        td {
            color: rgba(255, 255, 255, 0.85);
            vertical-align: middle;
        }

        /* تنسيق العميل غير المفعل (Freeze State) */
        tr.frozen-row {
            opacity: 0.45;
            background: rgba(255, 255, 255, 0.01);
        }

        .client-id-badge {
            font-family: monospace !important;
            background: rgba(0, 229, 255, 0.1);
            color: #00e5ff;
            padding: 4px 8px;
            border-radius: 6px;
            border: 1px solid rgba(0, 229, 255, 0.2);
            font-size: 0.8rem;
            font-weight: bold;
        }

        .client-info {
            text-align: right;
        }

        .client-name {
            font-weight: 600;
            color: #fff;
            display: block;
        }

        .client-phone {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.5);
        }

        .platform-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 4px 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            font-size: 0.78rem;
        }

        /* Toggle Switch */
        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 22px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(255, 255, 255, 0.2);
            transition: .3s;
            border-radius: 22px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #2ecc71;
            box-shadow: 0 0 8px rgba(46, 204, 113, 0.4);
        }

        /* لون مميز لمفتاح تفعيل العميل الأساسي */
        input.master-switch:checked + .slider {
            background-color: #00e5ff;
            box-shadow: 0 0 8px rgba(0, 229, 255, 0.4);
        }

        input:checked + .slider:before {
            transform: translateX(22px);
        }

        /* مفاتيح تعطيل العميل المجمدة */
        .switch input:disabled + .slider {
            cursor: not-allowed;
            filter: grayscale(80%);
        }

        /* Input Subscription Days */
        .days-input {
            width: 65px;
            padding: 5px;
            background: #222;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            color: #00e5ff;
            text-align: center;
            font-weight: 600;
        }

        .days-input:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Total Summary Section */
        .summary-card {
            width: 100%;
            max-width: 1200px;
            background: rgba(0, 229, 255, 0.04);
            border: 1px dashed rgba(0, 229, 255, 0.3);
            border-radius: 12px;
            padding: 1.2rem 1.8rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 2rem;
            z-index: 10;
        }

        .summary-item {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .summary-label {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.65);
            margin-bottom: 0.2rem;
        }

        .summary-value {
            font-size: 1.2rem;
            font-weight: 700;
            color: #00e5ff;
        }

        footer {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding-top: 1rem;
            z-index: 10;
        }

        .social-links {
            display: flex;
            gap: 1.5rem;
            direction: ltr;
        }

        .social-icon-img {
            width: 38px;
            height: 38px;
            object-fit: contain;
            opacity: 0.95;
            transition: transform 0.2s;
        }

        .social-icon-img:hover {
            transform: scale(1.15);
        }
    </style>
</head>
<body>

    <!-- 🔒 نافذة تسجيل الدخول -->
    <div class="login-overlay" id="loginOverlay">
        <div class="login-box">
            <h2>تسجيل دخول الأدمن</h2>
            <p>أدخل البيانات للوصول لإدارة العملاء والاشتراكات</p>
            <div class="input-group">
                <label>اسم المستخدم</label>
                <input type="text" id="adminUser" placeholder="admin">
            </div>
            <div class="input-group">
                <label>كلمة السر</label>
                <input type="password" id="adminPass" placeholder="••••••">
            </div>
            <button class="btn-login" onclick="handleLogin()">دخول لوحة التحكم</button>
        </div>
    </div>

    <div class="main-container">

        <!-- Top Header -->
        <header class="top-header">
            <h1 class="page-title">لوحة <span>Proton Admin</span></h1>
            <button class="btn-logout" onclick="logout()">تسجيل الخروج</button>
        </header>

        <!-- Main Dashboard Table -->
        <div class="dashboard-card">
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Client ID</th>
                            <th style="text-align: right;">العميل</th>
                            <th>المنصة</th>
                            <th>حالة العميل</th>
                            <th>نشر تلقائي</th>
                            <th>نشر الريلز</th>
                            <th>التعليقات</th>
                            <th>الرسائل</th>
                            <th>مدة الاشتراك (يوم)</th>
                            <th>المبلغ الشهري</th>
                        </tr>
                    </thead>
                    <tbody id="clientsTableBody">
                        <!-- يتم جلب وتبديل بيانات العملاء هنا -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Total Summary Footer Card -->
        <div class="summary-card">
            <div class="summary-item">
                <span class="summary-label">إجمالي العملاء:</span>
                <span class="summary-value" id="totalClients">0</span>
            </div>
            <div class="summary-item">
                <span class="summary-label">إجمالي المنصات المربوطة:</span>
                <span class="summary-value" id="totalPlatforms">0</span>
            </div>
            <div class="summary-item">
                <span class="summary-label">إجمالي الإيراد الشهري:</span>
                <span class="summary-value" id="totalRevenue">$0</span>
            </div>
        </div>

        <!-- Footer -->
        <footer>
            <div class="social-links">
                <a href="mailto:soliman@protonag.com" target="_blank"><img src="./icon1.png" onerror="this.onerror=null; this.src='./icon1.png';" alt="E-Mail" class="social-icon-img"></a>
                <a href="https://www.facebook.com/Soliman.Proton" target="_blank"><img src="./icon2.png" onerror="this.onerror=null; this.src='./icon2.png';" alt="Facebook" class="social-icon-img"></a>
                <a href="https://wa.me/+201066581983" target="_blank"><img src="./icon3.png" onerror="this.onerror=null; this.src='./icon3.png';" alt="WhatsApp" class="social-icon-img"></a>
            </div>
        </footer>

    </div>

    <script>
        // مصفوفة العملاء (يتم جلبها وتحديثها عبر الباك إند)
        let clientsData = [];

        // التحقق من وجود جلسة سابقة عند تحميل الصفحة
        window.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('admin_token');
            if (token) {
                document.getElementById('loginOverlay').style.display = 'none';
                fetchClientsData(token);
            }
        });

        // دالة تسجيل الدخول عبر API
        async function handleLogin() {
            const user = document.getElementById('adminUser').value;
            const pass = document.getElementById('adminPass').value;

            try {
                const response = await fetch('https://api.protonag.com/v1/admin/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username: user, password: pass })
                });

                if (response.ok) {
                    const data = await response.json();
                    localStorage.setItem('admin_token', data.token || 'active_session');
                    document.getElementById('loginOverlay').style.display = 'none';
                    fetchClientsData(data.token);
                } else {
                    // للتوافق الاحتياطي مع البيانات التجريبية المحلية في حال عدم توفر رد من السيرفر مؤقتاً
                    if (user === 'admin' && pass === '123456') {
                        localStorage.setItem('admin_token', 'local_fallback_token');
                        document.getElementById('loginOverlay').style.display = 'none';
                        loadFallbackData();
                    } else {
                        alert('اسم المستخدم أو كلمة السر غير صحيحة!');
                    }
                }
            } catch (error) {
                console.error("Login Error:", error);
                // السقوط الآمن في حال خطأ الشبكة
                if (user === 'admin' && pass === '123456') {
                    localStorage.setItem('admin_token', 'local_fallback_token');
                    document.getElementById('loginOverlay').style.display = 'none';
                    loadFallbackData();
                } else {
                    alert('تعذر الاتصال بالخادم، يرجى التحقق من بيانات الدخول.');
                }
            }
        }

        // جلب بيانات العملاء من السيرفر
        async function fetchClientsData(token) {
            try {
                const response = await fetch('https://api.protonag.com/v1/admin/clients', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    }
                });

                if (response.ok) {
                    clientsData = await response.json();
                    renderTable();
                } else {
                    loadFallbackData();
                }
            } catch (error) {
                console.error("Fetch Clients Error:", error);
                loadFallbackData();
            }
        }

        // بيانات احتياطية افتراضية في حالة عدم اتصال الخادم
        function loadFallbackData() {
            clientsData = [
                {
                    id: "CL-1001",
                    name: "شركة الأمل للتجارة",
                    phone: "+201012345678",
                    platform: "Facebook",
                    isActive: true,
                    autoPosts: true,
                    reels: true,
                    comments: true,
                    messages: false,
                    daysLeft: 30,
                    price: 65
                },
                {
                    id: "CL-1002",
                    name: "متجر الفخامة",
                    phone: "+201098765432",
                    platform: "Instagram",
                    isActive: true,
                    autoPosts: true,
                    reels: true,
                    comments: true,
                    messages: true,
                    daysLeft: 15,
                    price: 85
                },
                {
                    id: "CL-1003",
                    name: "مطعم البرنس",
                    phone: "+201155443322",
                    platform: "TikTok",
                    isActive: false,
                    autoPosts: true,
                    reels: true,
                    comments: true,
                    messages: false,
                    daysLeft: 0,
                    price: 70
                }
            ];
            renderTable();
        }

        function logout() {
            localStorage.removeItem('admin_token');
            document.getElementById('loginOverlay').style.display = 'flex';
        }

        function renderTable() {
            const tbody = document.getElementById('clientsTableBody');
            tbody.innerHTML = '';

            let totalPlatformsCount = clientsData.length;
            let totalRevenueSum = 0;
            let uniqueClients = new Set();

            clientsData.forEach((item, index) => {
                uniqueClients.add(item.name);
                totalRevenueSum += Number(item.price) || 0;

                const row = document.createElement('tr');
                if (!item.isActive) {
                    row.classList.add('frozen-row');
                }

                row.innerHTML = `
                    <td>
                        <span class="client-id-badge">${item.id}</span>
                    </td>
                    <td class="client-info">
                        <span class="client-name">${item.name}</span>
                        <span class="client-phone">${item.phone}</span>
                    </td>
                    <td>
                        <span class="platform-badge">${item.platform}</span>
                    </td>
                    <!-- مفتاح التفعيل الكلي -->
                    <td>
                        <label class="switch">
                            <input type="checkbox" class="master-switch" ${item.isActive ? 'checked' : ''} onchange="toggleClientStatus(${index}, this.checked)">
                            <span class="slider"></span>
                        </label>
                    </td>
                    <!-- الخدمات تظل مقروءة ومحفوظة لكن تجمّد إذا كان العميل غير مفعّل -->
                    <td>
                        <label class="switch">
                            <input type="checkbox" ${item.autoPosts ? 'checked' : ''} ${!item.isActive ? 'disabled' : ''} onchange="autoSaveService(${index}, 'autoPosts', this.checked)">
                            <span class="slider"></span>
                        </label>
                    </td>
                    <td>
                        <label class="switch">
                            <input type="checkbox" ${item.reels ? 'checked' : ''} ${!item.isActive ? 'disabled' : ''} onchange="autoSaveService(${index}, 'reels', this.checked)">
                            <span class="slider"></span>
                        </label>
                    </td>
                    <td>
                        <label class="switch">
                            <input type="checkbox" ${item.comments ? 'checked' : ''} ${!item.isActive ? 'disabled' : ''} onchange="autoSaveService(${index}, 'comments', this.checked)">
                            <span class="slider"></span>
                        </label>
                    </td>
                    <td>
                        <label class="switch">
                            <input type="checkbox" ${item.messages ? 'checked' : ''} ${!item.isActive ? 'disabled' : ''} onchange="autoSaveService(${index}, 'messages', this.checked)">
                            <span class="slider"></span>
                        </label>
                    </td>
                    <td>
                        <input type="number" class="days-input" value="${item.daysLeft}" ${!item.isActive ? 'disabled' : ''} onchange="autoSaveService(${index}, 'daysLeft', parseInt(this.value))">
                    </td>
                    <td style="color: #00e5ff; font-weight: 600;">$${item.price}</td>
                `;
                tbody.appendChild(row);
            });

            // تحديث البطاقة الإحصائية
            document.getElementById('totalClients').textContent = uniqueClients.size;
            document.getElementById('totalPlatforms').textContent = totalPlatformsCount;
            document.getElementById('totalRevenue').textContent = `$${totalRevenueSum}`;
        }

        // تفعيل أو تجميد العميل مع إرسال التحديث للباك إند
        async function toggleClientStatus(index, isChecked) {
            clientsData[index].isActive = isChecked;
            renderTable();
            
            try {
                await fetch(`https://api.protonag.com/v1/admin/clients/${clientsData[index].id}/status`, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + localStorage.getItem('admin_token')
                    },
                    body: JSON.stringify({ isActive: isChecked })
                });
            } catch (error) {
                console.error("Sync error:", error);
            }
        }

        // الحفظ المباشر التلقائي لأي تعديل على الخدمات وإرساله للباك إند
        async function autoSaveService(index, field, value) {
            clientsData[index][field] = value;
            
            try {
                await fetch(`https://api.protonag.com/v1/admin/clients/${clientsData[index].id}/update`, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + localStorage.getItem('admin_token')
                    },
                    body: JSON.stringify({ [field]: value })
                });
            } catch (error) {
                console.error("Auto save sync error:", error);
            }
        }
    </script>
</body>
</html>
