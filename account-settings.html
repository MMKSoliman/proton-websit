<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إعدادات الحساب - Proton</title>
    <link rel="icon" type="image/png" href="./favicon.png">
    <!-- ملف الـ CSS الموحد للموقع -->
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <div class="main-container">
        <!-- الهيدر يتم استدعاؤه ديناميكياً -->
        <div id="header-container" class="top-header"></div>

        <!-- محتوى صفحة إعدادات الحساب -->
        <div class="center-content">
            <div class="dashboard-card auth-card" style="max-width: 600px; text-align: right;">
                <div class="card-header">
                    <h2 class="card-title">إعدادات الحساب الشخصي</h2>
                    <p class="card-subtitle" style="margin: 0 auto 1.5rem auto;">قم بتحديث بياناتك الشخصية، معلومات التواصل، أو كلمة المرور الخاصة بك بكل سهولة.</p>
                </div>

                <!-- نموذج تعديل البيانات الشخصية المطلوبة -->
                <form id="profileForm" onsubmit="handleProfileUpdate(event)">
                    <div class="form-group">
                        <label for="userNameInput">الاسم الشخصي</label>
                        <input type="text" id="userNameInput" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <label for="pEmailInput">البريد الإلكتروني</label>
                        <input type="email" id="pEmailInput" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <label for="userPhoneInput">رقم الهاتف</label>
                        <input type="text" id="userPhoneInput" class="form-control" required placeholder="+201000000000">
                    </div>

                    <button type="submit" id="profileSubmitBtn" class="btn-submit" style="margin-top: 1rem;">حفظ التعديلات الشخصية</button>
                </form>

                <div class="divider">تغيير كلمة المرور</div>

                <!-- نموذج تغيير كلمة المرور أو تعيينها مع خانة التأكيد -->
                <form id="passwordForm" onsubmit="handlePasswordChange(event)">
                    <div class="form-group" id="currentPassGroup">
                        <label for="currentPasswordInput">كلمة المرور الحالية</label>
                        <input type="password" id="currentPasswordInput" class="form-control" placeholder="اتركها فارغة إذا سجلت عبر جوجل/فيس بوك ولم تحدد كلمة مرور مسبقاً">
                    </div>

                    <div class="form-group">
                        <label for="newPasswordInput">كلمة المرور الجديدة</label>
                        <input type="password" id="newPasswordInput" class="form-control" required placeholder="أدخل كلمة المرور الجديدة">
                    </div>

                    <div class="form-group">
                        <label for="confirmPasswordInput">تأكيد كلمة المرور الجديدة</label>
                        <input type="password" id="confirmPasswordInput" class="form-control" required placeholder="أعد إدخال كلمة المرور الجديدة">
                    </div>

                    <button type="submit" class="btn-submit" style="background: linear-gradient(135deg, #2ecc71, #27ae60); margin-top: 1rem;">تحديث كلمة المرور</button>
                </form>
            </div>
        </div>

        <!-- الفوتر يتم استدعاؤه ديناميكياً -->
        <div id="footer-container"></div>
    </div>

    <!-- السكريبتات الأساسية وحماية الصفحة -->
    <script>
        fetch('footer.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('footer-container').innerHTML = data;
            });
    </script>
    <script src="./header.js" defer></script>
    <script src="./auth-guard.js"></script>
    <script>
        const API_BASE_URL = "https://api.protonag.com";

        // دالة لجلب بيانات المستخدم الحالية وعرضها في الحقول بدقة
        async function fetchUserData() {
            const token = localStorage.getItem("access_token");
            if (!token) {
                window.location.href = "./auth.html";
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/auth/me`, {
                    method: "GET",
                    headers: {
                        "Authorization": `Bearer ${token}`
                    }
                });

                if (!response.ok) throw new Error("فشل في جلب بيانات الحساب");

                const data = await response.json();
                
                // تعبئة الحقول بالمتغيرات المطلوبة بما فيها رقم الهاتف
                document.getElementById("userNameInput").value = data.user_name || "";
                document.getElementById("pEmailInput").value = data.p_email || "";
                document.getElementById("userPhoneInput").value = data.user_phone_number || "";

            } catch (error) {
                console.error(error);
                alert("انتهت صلاحية الجلسة أو حدث خطأ، يرجى تسجيل الدخول مرة أخرى.");
                localStorage.removeItem("access_token");
                window.location.href = "./auth.html";
            }
        }

        // دالة تحديث الملف الشخصي وإرسال البيانات المتوافقة مع الـ Onboarding Endpoint الموجودة مسبقاً
        async function handleProfileUpdate(e) {
            e.preventDefault();
            const token = localStorage.getItem("access_token");
            
            const formData = new FormData();
            formData.append('user_name', document.getElementById("userNameInput").value);
            formData.append('p_email', document.getElementById("pEmailInput").value);
            formData.append('user_phone_number', document.getElementById("userPhoneInput").value);

            // إرسال قيم وهمية أو فارغة لحقول البراند الإجبارية لكي يتخطى الباك إند التحقق بدون أخطاء دون إنشاء براند جديد أو التأثير على البراندات الحالية
            formData.append('brand_name', 'Update_Profile_Temp');
            formData.append('brand_type', 'N/A');
            formData.append('niche', 'N/A');
            formData.append('audience', 'N/A');

            const submitBtn = document.getElementById("profileSubmitBtn");
            submitBtn.disabled = true;
            submitBtn.textContent = "جاري الحفظ...";

            try {
                const response = await fetch(`${API_BASE_URL}/onboarding/save`, {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${token}`
                    },
                    body: formData
                });

                let result;
                try {
                    result = await response.json();
                } catch (err) {
                    result = {};
                }

                if (!response.ok) throw new Error(result.message || "فشل تحديث البيانات الشخصية");

                alert("تم تحديث وحفظ بيانات الحساب في قاعدة البيانات بنجاح!");
            } catch (error) {
                alert(error.message || "حدث خطأ أثناء الاتصال بالخادم.");
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = "حفظ التعديلات الشخصية";
            }
        }

        // دالة تغيير كلمة المرور مع التحقق من التطابق
        async function handlePasswordChange(e) {
            e.preventDefault();
            const token = localStorage.getItem("access_token");
            const currentPassword = document.getElementById("currentPasswordInput").value;
            const newPassword = document.getElementById("newPasswordInput").value;
            const confirmPassword = document.getElementById("confirmPasswordInput").value;

            if (newPassword !== confirmPassword) {
                alert("كلمات المرور الجديدة غير متطابقة، يرجى التأكد.");
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/auth/change-password`, {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${token}`
                    },
                    body: JSON.stringify({ 
                        current_password: currentPassword || "", 
                        new_password: newPassword 
                    })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.detail || "فشل تحديث كلمة المرور");

                alert("تم تحديث كلمة المرور بنجاح! يمكنك الآن تسجيل الدخول بها مستقبلاً.");
                document.getElementById("passwordForm").reset();
            } catch (error) {
                alert(error.message || "حدث خطأ أثناء تحديث كلمة المرور. تأكد من صحة كلمة المرور الحالية.");
            }
        }

        // استدعاء البيانات فور تحميل الصفحة
        document.addEventListener("DOMContentLoaded", fetchUserData);
    </script>
</body>
</html>
