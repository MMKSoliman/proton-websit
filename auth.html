<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <script src="./auth-guard.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proton - تسجيل الدخول</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="./favicon.webp">
    
    <!-- Google Fonts: Cairo (Arabic) & Open Sans (English) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <div class="main-container">
        
        <!-- الهيدر العلوي -->
        <div class="top-header">
            <!-- سيتم تعبئته ديناميكياً بواسطة header.js -->
        </div>

        <!-- محتوى الصفحة في المنتصف -->
        <div class="center-content">
            <div class="auth-card">
                <h2 class="auth-title" id="formTitle">تسجيل الدخول</h2>

                <div class="social-buttons">
                    <button class="btn-social" onclick="loginWithGoogle()">
                        <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google">
                        المتابعة بواسطة Google
                    </button>
                    <button class="btn-social" onclick="loginWithFacebook()">
                        <img src="https://www.svgrepo.com/show/475647/facebook-color.svg" alt="Facebook">
                        المتابعة بواسطة Facebook
                    </button>
                </div>

                <div class="divider">أو باستخدام البريد الإلكتروني</div>

                <form id="authForm" onsubmit="handleAuthSubmit(event)">
                    <div class="form-group" id="fullNameGroup" style="display: none;">
                        <label>الاسم الكامل</label>
                        <input type="text" class="form-control" placeholder="أدخل اسمك الكامل" id="fullNameInput">
                    </div>

                    <div class="form-group">
                        <label>البريد الإلكتروني</label>
                        <input type="email" class="form-control" placeholder="name@domain.com" required id="emailInput">
                    </div>

                    <div class="form-group">
                        <label>كلمة المرور</label>
                        <input type="password" class="form-control" placeholder="••••••••" required id="passwordInput">
                    </div>

                    <div class="form-group" id="confirmPasswordGroup" style="display: none;">
                        <label>تأكيد كلمة المرور</label>
                        <input type="password" class="form-control" placeholder="••••••••" id="confirmPasswordInput">
                    </div>

                    <div class="form-group" id="forgotPasswordWrapper" style="text-align: left; margin-bottom: 1.5rem;">
                        <a href="#" style="color: rgba(255,255,255,0.5); font-size: 0.8rem; text-decoration: none;" onclick="forgotPassword(event)">نسيت كلمة المرور؟</a>
                    </div>

                    <button type="submit" class="btn-submit" id="submitBtn">تسجيل الدخول</button>
                </form>

                <div class="auth-footer-links">
                    <span id="toggleText">ليس لديك حساب؟</span>
                    <a href="#" id="toggleBtn" onclick="toggleAuthMode(event)">إنشاء حساب جديد</a>
                </div>
            </div>
        </div>

        <!-- Footer الموحد -->
        <div id="footer-container"></div>

    </div>

    <!-- جلب الفوتر الخارجي -->
    <script>
        fetch('footer.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('footer-container').innerHTML = data;
            });
    </script>
    <script src="./whatsapp-widget.js" defer></script>
    <!-- السكريبتات -->
    <script src="./header.js" defer></script>
    <script src="./auth-guard.js"></script>
    <script>
        const API_BASE_URL = "https://api.protonag.com";
        let isSignUp = false;

        function toggleAuthMode(e) {
            e.preventDefault();
            isSignUp = !isSignUp;
            
            const formTitle = document.getElementById("formTitle");
            const submitBtn = document.getElementById("submitBtn");
            const toggleText = document.getElementById("toggleText");
            const toggleBtn = document.getElementById("toggleBtn");
            const fullNameGroup = document.getElementById("fullNameGroup");
            const fullNameInput = document.getElementById("fullNameInput");
            const confirmPasswordGroup = document.getElementById("confirmPasswordGroup");
            const confirmPasswordInput = document.getElementById("confirmPasswordInput");
            const forgotPasswordWrapper = document.getElementById("forgotPasswordWrapper");

            if (isSignUp) {
                formTitle.textContent = "إنشاء حساب جديد";
                submitBtn.textContent = "إنشاء الحساب";
                toggleText.textContent = "لديك حساب بالفعل؟";
                toggleBtn.textContent = "تسجيل الدخول";
                
                fullNameGroup.style.display = "block";
                fullNameInput.setAttribute("required", "true");
                
                confirmPasswordGroup.style.display = "block";
                confirmPasswordInput.setAttribute("required", "true");
                forgotPasswordWrapper.style.display = "none";
            } else {
                formTitle.textContent = "تسجيل الدخول";
                submitBtn.textContent = "تسجيل الدخول";
                toggleText.textContent = "ليس لديك حساب؟";
                toggleBtn.textContent = "إنشاء حساب جديد";
                
                fullNameGroup.style.display = "none";
                fullNameInput.removeAttribute("required");

                confirmPasswordGroup.style.display = "none";
                confirmPasswordInput.removeAttribute("required");
                forgotPasswordWrapper.style.display = "block";
            }
        }

        async function handleAuthSubmit(e) {
            e.preventDefault();
            
            const email = document.getElementById("emailInput").value;
            const password = document.getElementById("passwordInput").value;

            if (isSignUp) {
                const fullName = document.getElementById("fullNameInput").value;
                const confirmPassword = document.getElementById("confirmPasswordInput").value;

                if (password !== confirmPassword) {
                    alert("كلمات المرور غير متطابقة، يرجى التأكد.");
                    return;
                }

                try {
                    const response = await fetch(`${API_BASE_URL}/auth/register`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ full_name: fullName, email: email, password: password })
                    });

                    const data = await response.json();
                    if (!response.ok) throw new Error(data.detail || "فشل إنشاء الحساب");

                    alert("تم إنشاء الحساب بنجاح، يرجى تسجيل الدخول.");
                    toggleAuthMode(e);
                } catch (error) {
                    alert(error.message || "حدث خطأ أثناء الاتصال بالخادم.");
                }

            } else {
                try {
                    const response = await fetch(`${API_BASE_URL}/auth/login`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ email: email, password: password })
                    });

                    const data = await response.json();
                    if (!response.ok) throw new Error(data.detail || "بيانات الدخول غير صحيحة");

                    localStorage.setItem("access_token", data.access_token);
                    window.location.href = "./dashboard.html";
                } catch (error) {
                    alert(error.message || "البريد الإلكتروني أو كلمة المرور غير صحيحة.");
                }
            }
        }

        function loginWithGoogle() {
            window.location.href = `${API_BASE_URL}/auth/google/login`;
        }

        function loginWithFacebook() {
            window.location.href = `${API_BASE_URL}/auth/facebook/login`;
        }

        async function forgotPassword(e) {
            e.preventDefault();
            const email = document.getElementById("emailInput").value;
            if (!email) {
                alert("يرجى إدخال البريد الإلكتروني أولاً.");
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/auth/forgot-password`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email: email })
                });

                if (!response.ok) throw new Error("فشل إرسال طلب استعادة كلمة المرور");
                alert("تم إرسال رابط إعادة تعيين كلمة المرور إلى بريدك الإلكتروني.");
            } catch (error) {
                alert("حدث خطأ أثناء المحاولة.");
            }
        }
    </script>
</body>
</html>
