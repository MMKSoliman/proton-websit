<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إعادة تعيين كلمة المرور - Proton</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="./favicon.webp">
    
    <!-- Google Fonts: Cairo (Arabic) & Open Sans (English) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1a1a1a;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            border: 1px solid #2a2a2a;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h2 {
            margin-bottom: 20px;
            font-size: 24px;
            color: #ffffff;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: right;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #b0b0b0;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 12px;
            background-color: #121212;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            color: #ffffff;
            font-size: 16px;
            box-sizing: border-box;
        }
        input:focus {
            outline: none;
            border-color: #00d2ff;
        }
        button {
            width: 100%;
            background: linear-gradient(135deg, #0055ff 0%, #00d2ff 100%);
            color: #ffffff;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0, 210, 255, 0.3);
        }
        button:hover {
            opacity: 0.9;
        }
        .message {
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>إعادة تعيين كلمة المرور</h2>
        <form id="resetForm">
            <div class="form-group">
                <label for="newPassword">كلمة المرور الجديدة</label>
                <input type="password" id="newPassword" required placeholder="أدخل كلمة المرور الجديدة">
            </div>
            <button type="submit" id="submitBtn">حفظ كلمة المرور</button>
        </form>
        <div id="responseMessage" class="message"></div>
    </div>
    <!-- جلب الفوتر الخارجي -->
    <script>
        fetch('footer.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('footer-container').innerHTML = data;
            });
    </script>
    <script src="./whatsapp-widget.js" defer></script>
    <!-- السكريبتات -->
    <script src="./header.js" defer></script>

    <script>
        const API_BASE_URL = "https://api.protonag.com";

        // استخراج التوكن من رابط الـ URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get("token");

        if (!token) {
            document.getElementById("responseMessage").style.color = "#ff4d4d";
            document.getElementById("responseMessage").textContent = "رابط إعادة التعيين غير صالح أو مفقود.";
            document.getElementById("resetForm").style.display = "none";
        }

        document.getElementById("resetForm").addEventListener("submit", async function(e) {
            e.preventDefault();
            const newPassword = document.getElementById("newPassword").value;
            const messageDiv = document.getElementById("responseMessage");
            const submitBtn = document.getElementById("submitBtn");

            submitBtn.disabled = true;
            submitBtn.textContent = "جاري الحفظ...";

            try {
                const response = await fetch(`${API_BASE_URL}/auth/reset-password`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ token: token, new_password: newPassword })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || "حدث خطأ ما");
                }

                messageDiv.style.color = "#00d2ff";
                messageDiv.textContent = "تم تغيير كلمة المرور بنجاح! سيتم توجيهك لتسجيل الدخول...";
                
                setTimeout(() => {
                    window.location.href = "https://protonag.com/login.html"; // أو صفحة الدخول الخاصة بك
                }, 2000);

            } catch (error) {
                messageDiv.style.color = "#ff4d4d";
                messageDiv.textContent = error.message;
                submitBtn.disabled = false;
                submitBtn.textContent = "حفظ كلمة المرور";
            }
        });
    </script>
</body>
</html>
