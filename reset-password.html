<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إعادة تعيين كلمة المرور - Proton</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="./favicon.webp">
    
    <!-- Google Fonts: Cairo (Arabic) & Open Sans (English) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Cairo', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-x: hidden;
        }
        
        /* حاوية الهيدر والفوتر لتجنب التداخل */
        #header-container {
            width: 100%;
            z-index: 10;
        }

        .main-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 40px 20px;
            box-sizing: border-box;
        }

        .card {
            background-color: #1a1a1a;
            padding: 35px 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            border: 1px solid #2a2a2a;
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 22px;
            color: #ffffff;
            font-weight: 700;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: right;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #b0b0b0;
            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            background-color: #121212;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            color: #ffffff;
            font-size: 15px;
            box-sizing: border-box;
            transition: border-color 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: #00d2ff;
        }

        button {
            width: 100%;
            background: linear-gradient(135deg, #0055ff 0%, #00d2ff 100%);
            color: #ffffff;
            padding: 13px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0, 210, 255, 0.3);
            transition: opacity 0.2s ease;
            margin-top: 5px;
        }

        button:hover {
            opacity: 0.9;
        }

        .message {
            margin-top: 15px;
            font-size: 14px;
            font-weight: 600;
        }

        #footer-container {
            width: 100%;
        }
    </style>
</head>
<body>
    <!-- الكارت في منتصف الشاشة بدقة -->
    <div class="main-container">
        <div class="card">
            <h2>إعادة تعيين كلمة المرور</h2>
            <form id="resetForm">
                <div class="form-group">
                    <label for="newPassword">كلمة المرور الجديدة</label>
                    <input type="password" id="newPassword" required placeholder="أدخل كلمة المرور الجديدة">
                </div>
                <div class="form-group">
                    <label for="confirmPassword">تأكيد كلمة المرور</label>
                    <input type="password" id="confirmPassword" required placeholder="أعد إدخال كلمة المرور">
                </div>
                <button type="submit" id="submitBtn">حفظ كلمة المرور</button>
            </form>
            <div id="responseMessage" class="message"></div>
        </div>
    </div>
    
    <!-- حاوية الفوتر الخارجي -->
    <div id="footer-container"></div>

    <!-- السكريبتات -->
    <script src="./whatsapp-widget.js" defer></script>
    <script src="./header.js" defer></script>
    <script>
        // جلب الفوتر الخارجي وتعبئته في الحاوية المخصصة
        fetch('footer.html')
            .then(response => response.text())
            .then(data => {
                const footerEl = document.getElementById('footer-container');
                if(footerEl) footerEl.innerHTML = data;
            }).catch(err => console.log('Footer load error:', err));
    </script>
    <script>
        const API_BASE_URL = "https://api.protonag.com";

        // استخراج التوكن من رابط الـ URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get("token");

        if (!token) {
            document.getElementById("responseMessage").style.color = "#ff4d4d";
            document.getElementById("responseMessage").textContent = "رابط إعادة التعيين غير صالح أو مفقود.";
            document.getElementById("resetForm").style.display = "none";
        }

        document.getElementById("resetForm").addEventListener("submit", async function(e) {
            e.preventDefault();
            const newPassword = document.getElementById("newPassword").value;
            const confirmPassword = document.getElementById("confirmPassword").value;
            const messageDiv = document.getElementById("responseMessage");
            const submitBtn = document.getElementById("submitBtn");

            // التحقق من تطابق كلمتي المرور
            if (newPassword !== confirmPassword) {
                messageDiv.style.color = "#ff4d4d";
                messageDiv.textContent = "كلمتا المرور غير متطابقتين!";
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = "جاري الحفظ...";

            try {
                const response =46700; // ملاحظة: تم ضبط جلب البيانات
                const res = await fetch(`${API_BASE_URL}/auth/reset-password`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ token: token, new_password: newPassword })
                });

                const data = await res.json();

                if (!res.ok) {
                    throw new Error(data.detail || "حدث خطأ ما");
                }

                messageDiv.style.color = "#00d2ff";
                messageDiv.textContent = "تم تغيير كلمة المرور بنجاح! سيتم توجيهك لتسجيل الدخول...";
                
                setTimeout(() => {
                    window.location.href = "https://protonag.com/login.html";
                }, 2000);

            } catch (error) {
                messageDiv.style.color = "#ff4d4d";
                messageDiv.textContent = error.message;
                submitBtn.disabled = false;
                submitBtn.textContent = "حفظ كلمة المرور";
            }
        });
    </script>
</body>
</html>
