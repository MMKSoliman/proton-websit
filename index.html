<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proton</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="./favicon.png">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            min-height: 100vh;
            width: 100%;
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #0d0d0d;
        }

        /* Container Layout */
        .main-container {
            position: relative;
            min-height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 2rem;
            
            /* Background Image Support */
            background: #0d0d0d url('./bg.png') center/cover no-repeat;
        }

        /* Footer & Icons */
        footer {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding-bottom: 1.5rem;
            z-index: 10;
        }

        .social-links {
            display: flex;
            gap: 1.5rem;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }

        .social-icon-img {
            width: 38px;
            height: 38px;
            object-fit: contain;
            display: block;
            transition: transform 0.2s ease, opacity 0.2s ease;
            opacity: 0.95;
        }

        .social-icon-img:hover {
            opacity: 1;
            transform: scale(1.15);
        }

        /* 📱 Mobile Responsiveness & Scroll Fix */
        @media (max-width: 768px) {
            body, html {
                overflow-y: auto !important;
            }

            .main-container {
                padding: 1.5rem 1rem;
                min-height: 100dvh;
            }

            .social-links {
                gap: 1.2rem;
            }

            .social-icon-img {
                width: 34px;
                height: 34px;
            }
        }
    </style>
</head>
<body>

    <div class="main-container">

        <!-- Social Media Icons Footer -->
        <footer>
            <div class="social-links">
                <!-- E-Mail -->
                <a href="mailto:soliman@protonag.com" target="_blank">
                    <img src="./Icon1.png" onerror="this.onerror=null; this.src='./icon1.png';" alt="E-Mail" class="social-icon-img">
                </a>
                
                <!-- Facebook -->
                <a href="https://www.facebook.com/Soliman.Proton" target="_blank">
                    <img src="./Icon2.png" onerror="this.onerror=null; this.src='./icon2.png';" alt="Facebook" class="social-icon-img">
                </a>
                
                <!-- WhatsApp -->
                <a href="https://wa.me/+201066581983" target="_blank">
                    <img src="./Icon3.png" onerror="this.onerror=null; this.src='./icon3.png';" alt="WhatsApp" class="social-icon-img">
                </a>
            </div>
        </footer>

    </div>

</body>
</html>
