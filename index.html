<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proton</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="./favicon.png">

    <!-- Google Fonts: Cairo & Open Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <div class="main-container">
        
        <!-- مساحة الهيدر العلوية (إن وجدت) -->
        <div class="top-header">
            <!-- عناصر الهيدر -->
        </div>

        <!-- محتوى الصفحة في المنتصف (الكروت / الشعار) -->
        <div class="center-content">
            <!-- ضع محتوى الصفحة هنا، وسيكون متمركزاً تماماً في الديسك توب والموبايل -->
        </div>

        <!-- Social Media Icons Footer (يتم تحميله تلقائياً) -->
        <footer>
            <div id="footer-container"></div>
        </footer>

    </div>

    <!-- سكربت جلب الفوتر الموحد تلقائياً -->
    <script>
        fetch('footer.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('footer-container').innerHTML = data;
            });
    </script>

    <!-- ملفات الجافا سكريبت الخاصة بالموقع -->
    <script src="./header.js" defer></script>
    <script src="./auth-guard.js"></script>

</body>
</html>
