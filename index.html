<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proton</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="./favicon.png">

    <!-- Google Fonts: Cairo & Open Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            min-height: 100vh;
            width: 100%;
            font-family: 'Open Sans', 'Cairo', system-ui, -apple-system, sans-serif;
            background-color: #0d0d0d;
            color: #ffffff;
            overflow-x: hidden;
        }

        /* Container Layout */
        .main-container {
            position: relative;
            min-height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 2rem;
            background: #0d0d0d url('./bg.png') center/cover no-repeat;
        }

        /* Top Header Action Area */
        .top-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            z-index: 20;
        }

        /* Center Content Area (لضبط الكروت في المنتصف تماماً) */
        .center-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 600px;
            margin: auto;
        }

        /* Footer & Social Icons */
        footer {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem 0;
            z-index: 10;
        }

        .social-links {
            display: flex;
            gap: 1.5rem;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }

        .social-icon-img {
            width: 38px;
            height: 38px;
            object-fit: contain;
            display: block;
            transition: transform 0.2s ease, opacity 0.2s ease;
            opacity: 0.95;
        }

        .social-icon-img:hover {
            opacity: 1;
            transform: scale(1.15);
        }

        /* 📱 Mobile Responsiveness */
        @media (max-width: 768px) {
            .main-container {
                padding: 1rem;
                min-height: 100dvh;
            }

            .top-header {
                padding: 10px 5px;
            }

            .social-links {
                gap: 1.2rem;
            }

            .social-icon-img {
                width: 34px;
                height: 34px;
            }
        }
    </style>
</head>
<body>

    <div class="main-container">
        
        <!-- مساحة الهيدر العلوية (إن وجدت) -->
        <div class="top-header">
            <!-- عناصر الهيدر -->
        </div>

        <!-- محتوى الصفحة في المنتصف (الكروت / الشعار) -->
        <div class="center-content">
            <!-- ضع محتوى الصفحة هنا، وسيكون متمركزاً تماماً في الديسك توب والموبايل -->
        </div>

        <!-- Social Media Icons Footer (يتم تحميله تلقائياً) -->
        <footer>
            <div id="footer-container"></div>
        </footer>

    </div>

    <!-- سكربت جلب الفوتر الموحد تلقائياً -->
    <script>
        fetch('footer.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('footer-container').innerHTML = data;
            });
    </script>

    <!-- ملفات الجافا سكريبت الخاصة بالموقع -->
    <script src="./header.js" defer></script>
    <script src="./auth-guard.js"></script>

</body>
</html>
