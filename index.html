<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proton</title>
    
    <!-- Favicon (Tab Logo) -->
    <link rel="icon" type="image/png" href="favicon.png">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            width: 100%;
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #000;
        }

        /* Background Image & Main Layout */
        .main-container {
            position: relative;
            min-height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 2.5rem 3rem;
            
            /* خلفية هيدر/سفلي احترافية مع دعم الشاشات */
            background: url('bg.png') center/cover no-repeat;
        }

        /* Bottom Footer (Social Media Icons Only) */
        footer {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding-bottom: 1rem;
        }

        .social-links {
            display: flex;
            gap: 1.5rem;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }

        .social-icon-img {
            width: 32px;
            height: 32px;
            object-fit: contain;
            transition: transform 0.2s ease, opacity 0.2s ease;
            opacity: 0.9;
        }

        .social-icon-img:hover {
            opacity: 1;
            transform: scale(1.1);
        }

        /* 📱 تنسيقات الشاشات الصغيرة والموبايل (Media Query في المكان الصحيح) */
        @media (max-width: 768px) {
            body, html {
                overflow-y: auto !important; /* السماح بالسكرول على الموبايل */
            }

            .main-container {
                padding: 1.5rem 1rem;
                justify-content: flex-end;
                min-height: 100dvh; /* توافق كامل مع متصفحات الموبايل */
            }

            .social-links {
                gap: 1.25rem;
            }

            .social-icon-img {
                width: 36px; /* تكبير بسيط لتسهيل الضغط باللمس */
                height: 36px;
            }
        }
    </style>
</head>
<body>

    <div class="main-container">

        <!-- Footer: Custom Social Media Image Icons -->
        <footer>
            <div class="social-links">
                <!-- أيقونة 1: E-Mail -->
                <a href="mailto:soliman@protonag.com" target="_blank">
                    <img src="Icon1.png" alt="E-Mail" class="social-icon-img" width="36" height="36">
                </a>
                
                <!-- أيقونة 2: Facebook -->
                <a href="https://www.facebook.com/Soliman.Proton" target="_blank">
                    <img src="Icon2.png" alt="Facebook" class="social-icon-img" width="36" height="36">
                </a>
                
                <!-- أيقونة 3: WhatsApp -->
                <a href="https://wa.me/+201066581983" target="_blank">
                    <img src="Icon3.png" alt="WhatsApp" class="social-icon-img" width="36" height="36">
                </a>
            </div>
        </footer>

    </div>

</body>
</html>
